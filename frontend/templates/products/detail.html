<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>产品详情</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <script defer src="/assets/app.js"></script>
    <script defer src="/assets/notifications.js"></script>
  </head>
  <body class="page-products page-detail">
    <header class="topbar">
      <div class="inner">
        <a class="brand" href="/"><span class="dot"></span><span>产品详情</span></a>
        <nav class="nav">
          <a class="btn" href="/dashboard">数据看板</a>
          <a class="btn" href="/categories">产品分类</a>
          <a class="btn" href="/cart">购物车</a>
          <a class="btn" href="/notifications">
            <span class="notification-nav-btn">
              通知
              <span class="notification-badge" data-role="unread-badge" style="display:none">0</span>
            </span>
          </a>
          <div class="pill" th:if="${#authorization.expression('isAuthenticated()')}">
            <span class="spark"></span><span th:text="'当前用户：' + ${username}">当前用户</span>
          </div>
          <a class="btn" href="/products">返回列表</a>
          <a class="btn primary" th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{'/products/' + ${product.id} + '/edit'}">编辑</a>
          <form method="post" th:action="@{'/products/' + ${product.id} + '/delete'}" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="btn danger" type="submit" data-confirm="确定删除该产品吗？">删除</button>
          </form>
          <form method="post" action="/logout" th:if="${#authorization.expression('isAuthenticated()')}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="btn" type="submit">退出</button>
          </form>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="card pad compact">
        <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:10px; flex-wrap:wrap">
          <div>
            <h1 class="h1" style="margin:0">产品详情</h1>
            <p class="sub" th:text="'ID：' + ${product.id}">ID</p>
          </div>
          <div class="pill">
            <span class="spark"></span>
            <span th:text="${product.status == 'ACTIVE' ? '启用' : (product.status == 'INACTIVE' ? '停用' : product.status)}">启用</span>
          </div>
        </div>

        <div class="kv" style="margin-top:12px">
          <div class="kv-row">
            <div class="kv-k">名称</div>
            <div class="kv-v" th:text="${product.name}">name</div>
          </div>
          <div class="kv-row" th:if="${product.coverImage != null and !product.coverImage.isEmpty()}">
            <div class="kv-k">封面图</div>
            <div class="kv-v"><img th:src="@{'/product-images/' + ${product.coverImage}}" alt="封面" class="cover-detail" /></div>
          </div>
          <div class="kv-row">
            <div class="kv-k">分类</div>
            <div class="kv-v" th:text="${product.categoryName}">-</div>
          </div>
          <div class="kv-row">
            <div class="kv-k">描述</div>
            <div class="kv-v" th:text="${product.description}">desc</div>
          </div>
          <div class="kv-row">
            <div class="kv-k">价格</div>
            <div class="kv-v"><span th:text="${product.price}">0</span> 元</div>
          </div>
          <div class="kv-row">
            <div class="kv-k">库存</div>
            <div class="kv-v" th:text="${product.stock}">0</div>
          </div>
          <div class="kv-row">
            <div class="kv-k">状态</div>
            <div class="kv-v">
              <span class="pill" th:classappend="${product.status == 'ACTIVE' ? 'status-active' : 'status-inactive'}">
                <span class="spark"></span>
                <span th:text="${product.status == 'ACTIVE' ? '在售' : '已下架'}">在售</span>
              </span>
            </div>
          </div>
          <div class="kv-row">
            <div class="kv-k">创建时间</div>
            <div class="kv-v" th:text="${#temporals.format(product.createdAt, 'yyyy-MM-dd HH:mm')}">time</div>
          </div>
          <div class="kv-row">
            <div class="kv-k">更新时间</div>
            <div class="kv-v" th:text="${#temporals.format(product.updatedAt, 'yyyy-MM-dd HH:mm')}">time</div>
          </div>
        </div>

        <div style="margin-top:16px;padding:14px;border:1px dashed var(--stroke);border-radius:14px;background:rgba(255,255,255,.55)">
          <form method="post" action="/cart/add" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <input type="hidden" name="productId" th:value="${product.id}" />
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div style="display:flex;align-items:center;gap:8px">
              <label class="label" style="margin:0">数量：</label>
              <input type="number" name="quantity" class="input sm" style="width:100px" value="1" min="1" th:max="${product.stock}" th:disabled="${product.status != 'ACTIVE' or product.stock == 0}" required />
            </div>
            <button type="submit" class="btn primary" th:disabled="${product.status != 'ACTIVE' or product.stock == 0}" th:if="${product.status == 'ACTIVE' and product.stock > 0}">加入购物车</button>
            <button type="button" class="btn primary disabled-btn" th:if="${product.status != 'ACTIVE' or product.stock == 0}" disabled>
              <span th:if="${product.status != 'ACTIVE'}">已下架</span>
              <span th:if="${product.status == 'ACTIVE' and product.stock == 0}">缺货</span>
            </button>
          </form>
        </div>
      </section>
    </main>

    <script th:if="${flashOk}" th:inline="javascript">
      window.AppToast && window.AppToast.ok([[${flashOk}]]);
    </script>
    <script th:if="${flashError}" th:inline="javascript">
      window.AppToast && window.AppToast.bad([[${flashError}]]);
    </script>
  </body>
</html>
