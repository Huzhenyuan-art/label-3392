<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>数据看板</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <script defer src="/assets/app.js"></script>
    <script defer src="/assets/dashboard.js"></script>
    <script defer src="/assets/notifications.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  </head>
  <body class="page-dashboard">
    <header class="topbar">
      <div class="inner">
        <a class="brand" href="/"><span class="dot"></span><span>产品管理</span></a>
        <nav class="nav">
          <a class="btn active" href="/dashboard">数据看板</a>
          <a class="btn" href="/products">产品列表</a>
          <a class="btn" href="/categories">产品分类</a>
          <a class="btn" href="/cart">购物车</a>
          <a class="btn" href="/profile">个人中心</a>
          <a class="btn" th:if="${#authorization.expression('hasRole(''ADMIN'')')}" href="/admin/users">用户管理</a>
          <a class="btn" th:if="${#authorization.expression('hasRole(''ADMIN'')')}" href="/operation-logs">审计日志</a>
          <a class="btn" href="/notifications">
            <span class="notification-nav-btn">
              通知
              <span class="notification-badge" data-role="unread-badge" style="display:none">0</span>
            </span>
          </a>
          <div class="pill" th:if="${#authorization.expression('isAuthenticated()')}">
            <span class="spark"></span><span th:text="'当前用户：' + ${username}">当前用户</span>
          </div>
          <form method="post" action="/logout" th:if="${#authorization.expression('isAuthenticated()')}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="btn" type="submit">退出</button>
          </form>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="card pad compact">
        <h1 class="h1">数据看板</h1>
        <p class="sub">产品核心指标一览，数据每 5 分钟自动刷新，产品变更后即时更新。</p>
      </section>

      <div class="dashboard-grid">
        <div class="card pad stat-card" id="totalCard">
          <div class="stat-icon">&#128202;</div>
          <div class="stat-body">
            <div class="stat-label">产品总数</div>
            <div class="stat-value" id="totalCount">--</div>
          </div>
        </div>
        <div class="card pad stat-card" id="activeCard">
          <div class="stat-icon status-active-icon">&#9989;</div>
          <div class="stat-body">
            <div class="stat-label">启用产品</div>
            <div class="stat-value" id="activeCount">--</div>
            <div class="stat-pct" id="activePercent"></div>
          </div>
        </div>
        <div class="card pad stat-card" id="inactiveCard">
          <div class="stat-icon status-inactive-icon">&#9898;</div>
          <div class="stat-body">
            <div class="stat-label">停用产品</div>
            <div class="stat-value" id="inactiveCount">--</div>
            <div class="stat-pct" id="inactivePercent"></div>
          </div>
        </div>
      </div>

      <div class="dashboard-charts">
        <div class="card pad chart-card">
          <h3 class="chart-title">各状态产品占比</h3>
          <div class="chart-wrap">
            <canvas id="statusChart"></canvas>
          </div>
        </div>
        <div class="card pad chart-card">
          <h3 class="chart-title">近 7 日新增产品趋势</h3>
          <div class="chart-wrap">
            <canvas id="trendChart"></canvas>
          </div>
        </div>
      </div>

      <section class="card pad">
        <h3 class="chart-title">库存预警列表<span class="hint" style="margin-left:8px">库存低于 10 的产品</span></h3>
        <div class="table-wrap" id="lowStockWrap">
          <table>
            <thead>
              <tr>
                <th class="col-id">ID</th>
                <th class="col-name">名称</th>
                <th class="col-category">分类</th>
                <th class="col-stock">库存</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody id="lowStockBody">
              <tr><td colspan="5" class="hint">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
