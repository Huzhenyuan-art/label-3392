<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>我的购物车</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <script defer src="/assets/app.js"></script>
    <style>
      .cart-item{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:14px;border-bottom:1px solid var(--stroke)}
      .cart-item:last-child{border-bottom:none}
      .cart-item .info{min-width:0}
      .cart-item .name{font-weight:650;font-size:15px}
      .cart-item .meta{color:var(--muted);font-size:12px;margin-top:4px}
      .cart-item .price{font-weight:700;color:var(--brand0)}
      .cart-item .subtotal{font-weight:700;color:var(--brand1);min-width:80px;text-align:right}
      .cart-item .quantity-controls{display:flex;align-items:center;gap:8px}
      .cart-item .quantity-controls .input{width:70px;text-align:center}
      .cart-item .status-badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;margin-left:8px}
      .cart-item .status-badge.inactive{background:rgba(239,68,68,.12);color:var(--danger)}
      .cart-item .status-badge.low-stock{background:rgba(245,158,11,.12);color:#d97706}
      .cart-total{display:flex;justify-content:space-between;align-items:center;padding:16px 14px;border-top:2px solid var(--stroke);margin-top:4px}
      .cart-total .label{font-size:16px;font-weight:650}
      .cart-total .amount{font-size:22px;font-weight:800;color:var(--brand1)}
      .cart-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
      .empty-cart{text-align:center;padding:48px 20px;color:var(--muted)}
      .empty-cart .icon{font-size:48px;margin-bottom:12px;opacity:.5}
      .item-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
    </style>
  </head>
  <body class="page-cart">
    <header class="topbar">
      <div class="inner">
        <a class="brand" href="/"><span class="dot"></span><span>产品管理</span></a>
        <nav class="nav">
          <a class="btn" href="/dashboard">数据看板</a>
          <a class="btn" href="/products">产品列表</a>
          <a class="btn" href="/categories">产品分类</a>
          <a class="btn primary" href="/cart">购物车</a>
          <a class="btn" href="/profile">个人中心</a>
          <a class="btn" th:if="${#authorization.expression('hasRole(''ADMIN'')')}" href="/admin/users">用户管理</a>
          <a class="btn" th:if="${#authorization.expression('hasRole(''ADMIN'')')}" href="/operation-logs">审计日志</a>
          <a class="btn" href="/notifications">
            <span class="notification-nav-btn">
              通知
              <span class="notification-badge" data-role="unread-badge" style="display:none">0</span>
            </span>
          </a>
          <div class="pill" th:if="${#authorization.expression('isAuthenticated()')}">
            <span class="spark"></span><span th:text="'当前用户：' + ${username}">当前用户</span>
          </div>
          <form method="post" action="/logout" th:if="${#authorization.expression('isAuthenticated()')}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="btn" type="submit">退出</button>
          </form>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="card pad compact">
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap">
          <div>
            <h1 class="h1" style="margin-top:8px">我的购物车</h1>
            <p class="sub">管理您的购物车商品，修改数量或移除不需要的商品。</p>
          </div>
          <div class="pill">
            <span class="spark"></span>
            <span th:text="${#lists.size(items)} + ' 件商品'">0 件商品</span>
          </div>
        </div>
      </section>

      <section class="card pad" style="margin-top:14px">
        <div th:if="${#lists.isEmpty(items)}" class="empty-cart">
          <div class="icon">🛒</div>
          <p>购物车空空如也</p>
          <a class="btn primary" href="/products" style="margin-top:12px">去逛逛</a>
        </div>

        <div th:if="${not #lists.isEmpty(items)}">
          <div class="cart-item" th:each="item : ${items}">
            <div class="info">
              <div>
                <a class="name link" th:href="@{'/products/' + ${item.product.id}}" th:text="${item.product.name}">Product Name</a>
                <span class="status-badge inactive" th:if="${item.product.status != 'ACTIVE'}">已下架</span>
                <span class="status-badge low-stock" th:if="${item.product.status == 'ACTIVE' and item.product.stock < item.quantity}">库存不足</span>
              </div>
              <div class="meta">
                <span th:text="${item.product.categoryName}">分类</span>
                <span style="margin:0 6px">·</span>
                <span>单价：<span th:text="${item.product.price}">0</span> 元</span>
                <span style="margin:0 6px">·</span>
                <span>库存：<span th:text="${item.product.stock}">0</span></span>
              </div>
              <div class="item-actions">
                <form method="post" th:action="@{'/cart/' + ${item.id} + '/delete'}">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                  <button class="btn danger" type="submit" data-confirm="确定从购物车中移除该商品吗？">移除</button>
                </form>
              </div>
            </div>
            <div class="quantity-controls">
              <form method="post" th:action="@{'/cart/' + ${item.id} + '/update'}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div style="display:flex;align-items:center;gap:8px">
                  <input type="number" name="quantity" class="input sm" th:value="${item.quantity}" min="1" th:max="${item.product.stock}" required />
                  <button class="btn" type="submit">更新</button>
                </div>
              </form>
            </div>
            <div class="subtotal">
              <div><span th:text="${item.subtotal}">0.00</span> 元</div>
            </div>
          </div>

          <div class="cart-total">
            <div class="label">合计金额</div>
            <div class="amount"><span th:text="${total}">0.00</span> 元</div>
          </div>

          <div class="cart-actions">
            <a class="btn" href="/products">继续购物</a>
            <a class="btn primary" href="/cart/checkout">去结算</a>
          </div>
        </div>
      </section>
    </main>

    <script th:if="${flashOk}" th:inline="javascript">
      window.AppToast && window.AppToast.ok([[${flashOk}]]);
    </script>
    <script th:if="${flashError}" th:inline="javascript">
      window.AppToast && window.AppToast.bad([[${flashError}]]);
    </script>
  </body>
</html>
