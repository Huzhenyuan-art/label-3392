<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>订单结算</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <script defer src="/assets/app.js"></script>
    <style>
      .checkout-item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--stroke)}
      .checkout-item:last-child{border-bottom:none}
      .checkout-item .name{font-weight:600}
      .checkout-item .meta{color:var(--muted);font-size:12px;margin-top:4px}
      .checkout-item .right{text-align:right}
      .checkout-item .price{font-weight:700;color:var(--brand0)}
      .checkout-item .subtotal{font-weight:700;color:var(--brand1);font-size:16px}
      .error-box{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:12px;padding:12px;margin-bottom:14px}
      .error-box .title{font-weight:650;color:var(--danger);margin-bottom:6px}
      .error-box ul{margin:0;padding-left:20px}
      .error-box li{color:var(--danger);font-size:13px;margin-bottom:4px}
      .summary-card{background:linear-gradient(135deg,rgba(124,58,237,.08),rgba(37,99,235,.08));border:1px solid rgba(124,58,237,.2);border-radius:14px;padding:16px;margin-top:14px}
      .summary-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
      .summary-row.total{border-top:2px solid var(--stroke);margin-top:8px;padding-top:12px}
      .summary-row .label{color:var(--muted)}
      .summary-row .value{font-weight:650}
      .summary-row.total .label{font-size:16px;color:var(--text);font-weight:700}
      .summary-row.total .value{font-size:24px;font-weight:800;color:var(--brand1)}
      .checkout-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
      .success-indicator{display:inline-flex;align-items:center;gap:6px;background:rgba(22,163,74,.12);color:var(--ok);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:650}
      .disabled-btn{opacity:.5;cursor:not-allowed}
    </style>
    <script defer src="/assets/notifications.js"></script>
  </head>
  <body class="page-checkout">
    <header class="topbar">
      <div class="inner">
        <a class="brand" href="/"><span class="dot"></span><span>订单结算</span></a>
        <nav class="nav">
          <a class="btn" href="/dashboard">数据看板</a>
          <a class="btn" href="/products">产品列表</a>
          <a class="btn" href="/categories">产品分类</a>
          <a class="btn active" href="/cart">购物车</a>
          <a class="btn" href="/orders">我的订单</a>
          <a class="btn" href="/profile">个人中心</a>
          <a class="btn" th:if="${#authorization.expression('hasRole(''ADMIN'')')}" href="/admin/users">用户管理</a>
          <a class="btn" th:if="${#authorization.expression('hasRole(''ADMIN'')')}" href="/admin/orders">订单管理</a>
          <a class="btn" th:if="${#authorization.expression('hasRole(''ADMIN'')')}" href="/operation-logs">审计日志</a>
          <a class="btn" href="/notifications">
            <span class="notification-nav-btn">
              通知
              <span class="notification-badge" data-role="unread-badge" style="display:none">0</span>
            </span>
          </a>
          <div class="pill" th:if="${#authorization.expression('isAuthenticated()')}">
            <span class="spark"></span><span th:text="'当前用户：' + ${username}">当前用户</span>
          </div>
          <form method="post" action="/logout" th:if="${#authorization.expression('isAuthenticated()')}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="btn" type="submit">退出</button>
          </form>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="card pad compact">
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap">
          <div>
            <h1 class="h1" style="margin-top:8px">订单结算</h1>
            <p class="sub">确认订单信息，确认无误后可提交订单。</p>
          </div>
          <div class="success-indicator" th:if="${canCheckout}">
            <span>✓</span>
            <span>商品信息正常</span>
          </div>
        </div>
      </section>

      <div class="error-box" th:if="${not #lists.isEmpty(errors)}">
        <div class="title">⚠️ 订单存在以下问题，请先处理：</div>
        <ul>
          <li th:each="err : ${errors}" th:text="${err}">错误信息</li>
        </ul>
      </div>

      <section class="card pad" style="margin-top:14px">
        <h3 style="margin:0 0 12px 0">商品清单</h3>
        <div class="checkout-item" th:each="item : ${items}">
          <div>
            <div class="name" th:text="${item.product.name}">Product Name</div>
            <div class="meta">
              <span>单价：<span th:text="${item.product.price}">0</span> 元</span>
              <span style="margin:0 6px">·</span>
              <span>数量：<span th:text="${item.quantity}">1</span></span>
              <span style="margin:0 6px">·</span>
              <span th:if="${#strings.equals(item.product.status, 'ACTIVE')}" style="color:var(--ok)">✓ 在售</span>
              <span style="margin:0 6px">·</span>
              <span th:if="${!#strings.equals(item.product.status, 'ACTIVE')}" style="color:var(--danger)">✗ 已下架</span>
            </div>
            <div class="meta" th:if="${#strings.equals(item.product.status, 'ACTIVE') and item.product.stock >= item.quantity}">
              <span style="color:var(--ok)">✓ 库存充足（剩余 <span th:text="${item.product.stock}">0</span> 件）</span>
            </div>
            <div class="meta" th:if="${#strings.equals(item.product.status, 'ACTIVE') and item.product.stock < item.quantity}">
              <span style="color:var(--danger)">✗ 库存不足（剩余 <span th:text="${item.product.stock}">0</span> 件）</span>
            </div>
          </div>
          <div class="right">
            <div class="subtotal"><span th:text="${item.subtotal}">0.00</span> 元</div>
          </div>
        </div>

        <div class="summary-card">
          <div class="summary-row">
            <span class="label">商品件数</span>
            <span class="value" th:text="|${#lists.size(items)} 件|">0 件</span>
          </div>
          <div class="summary-row">
            <span class="label">商品总数</span>
            <span class="value" th:text="|${totalQuantity} 件|">0 件</span>
          </div>
          <div class="summary-row total">
            <span class="label">应付总额</span>
            <span class="value"><span th:text="${total}">0.00</span> 元</span>
          </div>
        </div>

        <div class="checkout-actions">
          <a class="btn" href="/cart">返回购物车</a>
          <form method="post" th:action="@{/orders}" th:if="${canCheckout}" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="btn primary" type="submit" data-confirm="确认提交订单？提交后将预占库存，请在30分钟内完成支付。">提交订单</button>
          </form>
          <button class="btn primary disabled-btn" th:if="${!canCheckout}" disabled>请先处理问题商品</button>
        </div>
      </section>
    </main>

    <script th:if="${flashOk}" th:inline="javascript">
      window.AppToast && window.AppToast.ok([[${flashOk}]]);
    </script>
    <script th:if="${flashError}" th:inline="javascript">
      window.AppToast && window.AppToast.bad([[${flashError}]]);
    </script>
  </body>
</html>
