<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${mode} == 'edit' ? '编辑分类' : '新增分类'">分类</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <script defer src="/assets/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="inner">
        <a class="brand" href="/categories"><span class="dot"></span><span th:text="${mode} == 'edit' ? '编辑分类' : '新增分类'">分类</span></a>
        <nav class="nav">
          <a class="btn" href="/products">产品管理</a>
          <a class="btn" href="/categories">返回列表</a>
          <a class="btn" href="/notifications">
            <span class="notification-nav-btn">
              通知
              <span class="notification-badge" data-role="unread-badge" style="display:none">0</span>
            </span>
          </a>
          <form method="post" action="/logout">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="btn" type="submit">退出</button>
          </form>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="card pad" style="max-width:820px; margin:18px auto">
        <div class="pill"><span class="spark"></span><span>MyBatis-Plus CRUD · 权限控制</span></div>
        <h1 class="h1" style="margin-top:12px" th:text="${mode} == 'edit' ? '编辑分类' : '新增分类'">分类</h1>
        <p class="sub">操作后将自动清理 Redis 缓存，列表实时刷新。</p>

        <form method="post" th:action="${mode} == 'edit' ? @{'/categories/' + ${form.id}} : @{/categories}" class="grid" style="margin-top:14px">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <input type="hidden" name="id" th:value="${form.id}" />

          <div class="grid cols2">
            <div class="field">
              <div class="label">名称</div>
              <input class="input" name="name" placeholder="分类名称" th:value="${form.name}" />
              <div class="hint">必填，1-50 字符，唯一。</div>
            </div>
            <div class="field">
              <div class="label">编码</div>
              <input class="input" name="code" placeholder="例如：LAPTOP" th:value="${form.code}" />
              <div class="hint">必填，1-50 字符，唯一。</div>
            </div>
          </div>

          <div class="grid cols2">
            <div class="field">
              <div class="label">排序</div>
              <input class="input" name="sortOrder" placeholder="例如：1" th:value="${form.sortOrder}" />
              <div class="hint">int，升序排列。</div>
            </div>
            <div class="field">
              <div class="label">状态</div>
              <select class="select" name="status">
                <option value="ACTIVE" th:selected="${form.status} == 'ACTIVE'">启用</option>
                <option value="INACTIVE" th:selected="${form.status} == 'INACTIVE'">停用</option>
              </select>
            </div>
          </div>

          <div class="field">
            <div class="label">描述</div>
            <textarea class="textarea" name="description" placeholder="分类描述" th:text="${form.description}"></textarea>
          </div>

          <div style="display:flex; gap:10px; flex-wrap:wrap">
            <button class="btn primary" type="submit" th:text="${mode} == 'edit' ? '保存修改' : '创建分类'">提交</button>
            <a class="btn" href="/categories">取消</a>
          </div>

          <div class="hint" th:if="${error}" th:text="${error}"></div>
        </form>
      </section>
    </main>
  </body>
</html>
